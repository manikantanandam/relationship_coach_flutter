  <!-- 
    CUSTOM MODIFICATION: Content Security Policy
    ============================================
    This CSP meta tag was added to fix console warnings about eval() being blocked.
    IMPORTANT: flutter build web does NOT regenerate this file, so this change is safe.
    However, if you run "flutter create ." to regenerate project files, this may be overwritten.
    If that happens, restore this CSP meta tag from git history.
    
    - unsafe-eval: Required for Flutter web's dynamic code loading mechanism
    - unsafe-inline: Allows inline scripts (needed for Flutter bootstrap)
    - data: blob:: Allows Flutter's dynamic asset loading
    - The unload event listener warning is from Flutter's internal code and cannot be fixed
  -->
